  const tW=gsap.timeline({paused:true});
  tW.fromTo(swA,{scale:0.12,opacity:0,svgOrigin:'960 540'},{scale:1.5,opacity:1,ease:'power2.out',duration:0.075},0);
  tW.to(swA,{scale:1.85,opacity:0,ease:'power1.in',duration:0.055},0.075);
  tW.to(swA,{rotation:160,svgOrigin:'960 540',ease:'none',duration:0.13},0);
  window.__timelines['sW1']=tW;

  // S2 theme — the period continues the ball from the match-cut
  const s2w=document.getElementById('s2-word'), s2dot=document.getElementById('s2-dot'),
        s2rule=document.getElementById('s2-rule'), s2en=document.getElementById('s2-en'), s2sub=document.getElementById('s2-sub');
  const t2=gsap.timeline({paused:true});
  t2.fromTo(s2dot,{scale:1,transformOrigin:'50% 50%'},{scale:1.14,duration:0.12,ease:'power2.out'},0);
  t2.to(s2dot,{scale:1,duration:0.26,ease:'elastic.out(1,0.55)'},0.12);
  t2.fromTo(s2w,{scale:0.6,opacity:0,transformOrigin:'50% 55%'},{scale:1,opacity:1,ease:'back.out(1.7)',duration:0.55},0.05);
  t2.fromTo(s2rule,{scaleX:0,transformOrigin:'0% 50%'},{scaleX:1,ease:'power2.out',duration:0.6},0.35);
  t2.fromTo(s2en,{opacity:0,y:24},{opacity:1,y:0,duration:0.45,ease:'power2.out'},0.75);
  t2.fromTo(s2sub,{opacity:0,y:20},{opacity:1,y:0,duration:0.45,ease:'power2.out'},1.05);
  t2.to(s2w,{y:-14,ease:'sine.inOut',duration:1.2,yoyo:true,repeat:1},1.3);
  window.__timelines['s2']=t2;

  // S3 trio
  const s3t1=document.getElementById('s3-t1'), s3t2=document.getElementById('s3-t2'),
        s3t3=document.getElementById('s3-t3'), s3big=document.getElementById('s3-big');
  const t3=gsap.timeline({paused:true});
  t3.fromTo(s3t1,{y:120,opacity:0},{y:0,opacity:1,ease:'back.out(1.4)',duration:0.5},0.1);
  t3.fromTo(s3t2,{y:120,opacity:0},{y:0,opacity:1,ease:'back.out(1.4)',duration:0.5},0.32);
  t3.fromTo(s3t3,{y:120,opacity:0},{y:0,opacity:1,ease:'back.out(1.4)',duration:0.5},0.54);
  t3.fromTo(s3big,{y:40,opacity:0},{y:0,opacity:1,ease:'power3.out',duration:0.5},0.9);
  t3.to([s3t1,s3t2,s3t3],{y:-12,ease:'sine.inOut',duration:0.8,yoyo:true,repeat:1,stagger:0.1},1.6);
  window.__timelines['s3']=t3;

  // S4 avatars wave
  const s4avs=gsap.utils.toArray('#s4-row .av'), s4title=document.getElementById('s4-title'), s4sub=document.getElementById('s4-sub');
  const t4=gsap.timeline({paused:true});
  t4.fromTo(s4title,{y:-40,opacity:0},{y:0,opacity:1,duration:0.5,ease:'power3.out'},0);
  t4.fromTo(s4avs,{y:260,opacity:0},{y:0,opacity:1,ease:'back.out(1.5)',duration:0.5,stagger:0.12},0.25);
  t4.to(s4avs,{y:-40,ease:'sine.inOut',duration:0.35,stagger:0.1},1.4);
  t4.to(s4avs,{y:0,ease:'sine.inOut',duration:0.35,stagger:0.1},1.95);
  t4.fromTo(s4sub,{opacity:0,y:20},{opacity:1,y:0,duration:0.45},1.0);
  window.__timelines['s4']=t4;

  // S5 radial tracks
  const s5ring=document.getElementById('s5-ring'), s5sp=document.getElementById('s5-spokes'),
        s5nd=document.getElementById('s5-nodes'), s5orbit=document.getElementById('s5-orbit'),
        s5big=document.getElementById('s5-big');
  const t5=gsap.timeline({paused:true});
  t5.fromTo(s5ring,{scale:0.2,opacity:0,svgOrigin:'960 560'},{scale:1,opacity:1,ease:'back.out(1.6)',duration:0.6},0);
  t5.fromTo(s5sp,{scale:0,opacity:0,svgOrigin:'960 560'},{scale:1,opacity:1,ease:'power3.out',duration:0.5},0.35);
  t5.fromTo(s5nd,{scale:0,opacity:0,svgOrigin:'960 560'},{scale:1,opacity:1,ease:'back.out(1.8)',duration:0.5,stagger:0.06},0.6);
  t5.to(s5orbit,{rotation:360,svgOrigin:'960 560',ease:'none',duration:3.0},0.4);
  t5.fromTo(s5big,{opacity:0,y:24},{opacity:1,y:0,duration:0.5},1.2);
  window.__timelines['s5']=t5;

  // S6 prizes — count-up via pure-function ticker (tl.seek suppresses onUpdate)
  const s6prize=document.getElementById('s6-prize'), s6chips=gsap.utils.toArray('#s6-chips g');
  const t6=gsap.timeline({paused:true});
  t6.fromTo(s6chips,{y:80,opacity:0},{y:0,opacity:1,ease:'back.out(1.4)',duration:0.5,stagger:0.14},0.7);
  window.__timelines['s6']=t6;
  window.__tickers['s6'] = function(localT){
    const p = Math.min(1, Math.max(0, (localT - 0.2) / 1.4));
    const v = 50000 * (1 - Math.pow(1 - p, 2)); // power2.out
    s6prize.textContent = '¥' + Math.round(v).toLocaleString('en-US');
  };

  // S7 schedule
  const s7path=document.getElementById('s7-path'), s7nodes=gsap.utils.toArray('#s7-nodes g'),
        s7dot=document.getElementById('s7-dot'), s7big=document.getElementById('s7-big');
  const t7=gsap.timeline({paused:true});
  t7.fromTo(s7path,{strokeDashoffset:1320,strokeDasharray:'1320 1320'},{strokeDashoffset:0,duration:1.0,ease:'power2.inOut'},0.1);
  t7.fromTo(s7nodes,{scale:0,opacity:0,svgOrigin:'960 560'},{scale:1,opacity:1,ease:'back.out(1.8)',duration:0.4,stagger:0.22},0.4);
  t7.fromTo(s7dot,{attr:{cx:300}},{attr:{cx:1620},duration:2.4,ease:'none'},0.4);
  t7.fromTo(s7big,{opacity:0,y:24},{opacity:1,y:0,duration:0.5},1.4);
  window.__timelines['s7']=t7;

  // S8a–d keyword quadruple (one beat each): snap in, compress, settle
  [['a','#1660CB'],['b','#1660CB'],['c','#FDECD5'],['d','#FDECD5']].forEach(function(pair){
    const k=pair[0];
    const cn=document.getElementById('s8'+k+'-cn'), en=document.getElementById('s8'+k+'-en');
    const tk=gsap.timeline({paused:true});
    tk.fromTo(cn,{scale:1.8,opacity:0,transformOrigin:'50% 50%'},{scale:1,opacity:1,ease:'power4.out',duration:0.16},0);
    tk.fromTo(cn,{scaleY:1.25,transformOrigin:'50% 50%'},{scaleY:1,ease:'elastic.out(1,0.5)',duration:0.3},0.16);
    tk.fromTo(en,{opacity:0,y:14},{opacity:1,y:0,duration:0.2,ease:'power2.out'},0.14);
    window.__timelines['s8'+k]=tk;
  });

  // S9 join snap (+ orange-dot motif callback)
  const s9cn=document.getElementById('s9-cn'), s9en=document.getElementById('s9-en'), s9dm=document.getElementById('s9-dotm');
  const t9=gsap.timeline({paused:true});
  t9.fromTo(s9cn,{scale:2.4,rotation:18,opacity:0,transformOrigin:'50% 50%'},{scale:1,rotation:0,opacity:1,ease:'back.out(2.2)',duration:0.5},0);
  t9.fromTo(s9en,{opacity:0,y:30},{opacity:1,y:0,ease:'power2.out',duration:0.4},0.3);
  t9.fromTo(s9dm,{scale:0,transformOrigin:'50% 50%'},{scale:1,ease:'back.out(2.4)',duration:0.35},0.4);
  t9.to(s9cn,{scale:1.06,ease:'sine.inOut',duration:0.5,yoyo:true,repeat:1},0.6);
  window.__timelines['s9']=t9;

  // S10 final lockup
  const s10o1=document.getElementById('s10-o1'), s10o2=document.getElementById('s10-o2'),
        s10o3=document.getElementById('s10-o3'), s10o4=document.getElementById('s10-o4'),
        s10school=document.getElementById('s10-school'), s10name=document.getElementById('s10-name'),
        s10dot=document.getElementById('s10-dot'), s10qr=document.getElementById('s10-qr'),
        s10close=document.getElementById('s10-close');
  const t10=gsap.timeline({paused:true});
  t10.fromTo([s10o1,s10o2,s10o3,s10o4],{scale:0,opacity:0,transformOrigin:'50% 50%'},{scale:1,opacity:1,ease:'back.out(2)',duration:0.4,stagger:0.08},0);
  t10.fromTo(s10school,{y:-30,opacity:0},{y:0,opacity:1,duration:0.4,ease:'power3.out'},0.25);
  t10.fromTo(s10name,{scale:0.7,opacity:0,transformOrigin:'50% 50%'},{scale:1,opacity:1,ease:'back.out(1.7)',duration:0.5},0.4);
  t10.fromTo(s10dot,{scale:0,opacity:0,transformOrigin:'50% 50%'},{scale:1,opacity:1,ease:'back.out(2)',duration:0.35},0.7);
  t10.fromTo(s10qr,{scale:0.6,opacity:0,transformOrigin:'50% 50%'},{scale:1,opacity:1,ease:'back.out(1.6)',duration:0.45},0.6);
  t10.fromTo(s10close,{opacity:0,x:20},{opacity:1,x:0,duration:0.5,ease:'power2.out'},0.9);
  window.__timelines['s10']=t10;
})();

/* ---------- orchestrator ---------- */
(function(){
  const DURATION=30, BPM=108, BEAT=60/BPM;
  const SCENES=Array.prototype.slice.call(document.querySelectorAll('.scene'));
  const hud=document.getElementById('hud');
  const hudTR=document.getElementById('hud-tr'), hudBL=document.getElementById('hud-bl'),
        hudBR=document.getElementById('hud-br');
  const CHAPTERS={'s2':'00 · THEME','s3':'01 · 48H','s4':'02 · TEAM','s5':'03 · TRACKS',
    's6':'04 · PRIZES','s7':'05 · SCHEDULE','s8a':'06 · KEYWORDS','s8b':'06 · KEYWORDS',
    's8c':'06 · KEYWORDS','s8d':'06 · KEYWORDS','s9':'07 · JOIN'};
  SCENES.forEach(function(s){ s.style.display='none'; });
  hud.style.opacity='0';
  function pad(n,l){ n=String(Math.floor(n)); while(n.length<l) n='0'+n; return n; }
  function applyTime(T){
    let cur='';
    for(let i=0;i<SCENES.length;i++){
      const s=SCENES[i];
      if(s.dataset.overlay==='1'){                 // transition layer: sits on top
        const st=parseFloat(s.dataset.start), du=parseFloat(s.dataset.dur);
        if(T>=st && T<st+du){ s.style.display='block'; const tl=window.__timelines[s.id]; if(tl) tl.seek(T-st); }
        else s.style.display='none';
        continue;
      }
      const st=parseFloat(s.dataset.start), du=parseFloat(s.dataset.dur);
      if(T>=st && T<st+du){
        if(s.style.display!=='block') s.style.display='block';
        const tl=window.__timelines[s.id]; if(tl) tl.seek(T-st);
        if(window.__tickers[s.id]) window.__tickers[s.id](T-st);
        cur=s.id;
      } else if(s.style.display==='block'){
        s.style.display='none';
      }
    }
    const hudOn = T>=2.222 && T<27.222;
    hud.style.opacity = hudOn ? '1' : '0';
    if(hudOn){
      hudTR.textContent='TC '+pad(T/60,2)+':'+pad(T%60,2)+':'+pad((T%1)*30,2);
      hudBL.textContent=CHAPTERS[cur]||'';
      const beat=Math.floor(T/BEAT)%4;              // live beat indicator
      const pips=['▱','▱','▱','▱']; pips[beat]='▰';
      hudBR.textContent='108 BPM '+pips.join('');
    }
  }
  const params=new URLSearchParams(location.search);
  const tParam=params.get('t');
  if(tParam!==null){
    applyTime(parseFloat(tParam));
  } else {
    let T=0, last=performance.now();
    function loop(now){
      const dt=(now-last)/1000; last=now;
      T+=dt; if(T>=DURATION) T-=DURATION;
      applyTime(T);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    const a=document.getElementById('bgm'); if(a){ a.play().catch(function(){}); }
  }
})();
</script>
